name: Desktop app

# Builds the double-click CandyCrunch app (Windows installer, macOS disk image), checks that the built app predicts glycans,
# and attaches both to a published GitHub release; run it by hand (Actions > Desktop app > Run workflow) to get them as build artifacts
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install CandyCrunch
      run: |
        python -m pip install --upgrade pip
        pip install "glycowork @ git+https://github.com/BojarLab/glycowork.git@dev"
        pip install ".[gui]"
        # The app runs the model on ONNX Runtime; the spec leaves PyTorch out
        pip install "onnxruntime>=1.30"

    # Antivirus heuristics flag PyInstaller's precompiled bootloader, which malware ships too, so the Windows app gets one compiled here (the runner's MSVC)
    - name: Install PyInstaller with a bootloader built from source
      if: runner.os == 'Windows'
      env:
        PYINSTALLER_COMPILE_BOOTLOADER: 1
      run: pip install --no-binary pyinstaller --no-cache-dir --verbose pyinstaller==6.22.3 pyinstaller-hooks-contrib==2026.8

    - name: Install PyInstaller
      if: runner.os == 'macOS'
      run: pip install pyinstaller==6.22.3 pyinstaller-hooks-contrib==2026.8

    - name: Build the app
      run: pyinstaller --noconfirm packaging/candycrunch.spec

    - name: Check that the built app predicts (an extracted .xlsx and an mzML, in parallel)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $app = Start-Process -FilePath dist\CandyCrunch\CandyCrunch.exe -ArgumentList '--self-test', 'O', 'examples\JC_171002Y1_extracted_spectra.xlsx', 'packaging\self_test.mzML' -Wait -PassThru
        Get-Content candycrunch_self_test.log
        exit $app.ExitCode

    - name: Check that the built app predicts (an extracted .xlsx and an mzML, in parallel)
      if: runner.os == 'macOS'
      run: |
        status=0
        dist/CandyCrunch.app/Contents/MacOS/CandyCrunch --self-test O examples/JC_171002Y1_extracted_spectra.xlsx packaging/self_test.mzML || status=$?
        cat candycrunch_self_test.log
        exit $status

    - name: Build the Windows installer
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $version = python -c "from importlib.metadata import version; print(version('candycrunch'))"
        if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
        & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\candycrunch.iss
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    # No installer that Microsoft Defender flags reaches a release; the log names the file and the threat. The runner image excludes C:\ and D:\ from
    # scans (actions/runner-images Configure-WindowsDefender.ps1), so those exclusions go first. MpCmdRun exits 2 on a threat and on a scan that did not
    # run (hr = 0x800106ba: Defender service not running) alike, so its output decides; a scan that did not run fails a release and only warns otherwise
    - name: Scan the app and installer with Microsoft Defender
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $defender = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
        if (-not (Test-Path $defender)) { Write-Host 'Microsoft Defender is not installed on this runner'; exit 0 }
        try { Start-Service WinDefend -ErrorAction Stop } catch { Write-Host "Could not start the Defender service: $_" }
        try { Remove-MpPreference -ExclusionPath 'C:\', 'D:\' -ErrorAction Stop } catch { Write-Host "Could not remove the runner's scan exclusions: $_" }
        & $defender -SignatureUpdate | Out-Host
        foreach ($target in @((Resolve-Path dist\CandyCrunch).Path) + @(Get-ChildItem dist\CandyCrunch-*-Windows-Setup.exe | ForEach-Object FullName)) {
          $log = & $defender -Scan -ScanType 3 -File $target -DisableRemediation | Out-String
          Write-Host $log
          if ($log -match 'found [1-9]\d* threat') { Write-Host "::error::Microsoft Defender flags $target (file and threat listed above)"; exit 1 }
          if ($log -notmatch 'found no threats') {
            if ($env:GITHUB_EVENT_NAME -eq 'release') { Write-Host "::error::Microsoft Defender could not scan $target (error listed above); re-run the job"; exit 1 }
            Write-Host "::warning::Microsoft Defender could not scan $target (error listed above)"
          }
        }
        exit 0

    - name: Build the macOS disk image
      if: runner.os == 'macOS'
      run: |
        version=$(python -c "from importlib.metadata import version; print(version('candycrunch'))")
        hdiutil create -volname CandyCrunch -srcfolder dist/CandyCrunch.app -ov -format UDZO "dist/CandyCrunch-$version-macOS.dmg"

    - uses: actions/upload-artifact@v7
      with:
        name: CandyCrunch-${{ runner.os }}
        path: |
          dist/CandyCrunch-*-Windows-Setup.exe
          dist/CandyCrunch-*-macOS.dmg

    - name: Attach to the release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v3
      with:
        files: |
          dist/CandyCrunch-*-Windows-Setup.exe
          dist/CandyCrunch-*-macOS.dmg