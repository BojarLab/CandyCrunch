name: Desktop app

# Builds the double-click CandyCrunch app (Windows installer, macOS disk image), checks that the built app predicts glycans,
# and attaches both to a published GitHub release; run it by hand (Actions > Desktop app > Run workflow) to get them as build artifacts
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install CandyCrunch and PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install "glycowork[ml] @ git+https://github.com/BojarLab/glycowork.git@dev"
        pip install ".[gui]" pyinstaller

    - name: Build the app
      run: pyinstaller --noconfirm packaging/candycrunch.spec

    - name: Check that the built app predicts (an extracted .xlsx and an mzML, in parallel)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $app = Start-Process -FilePath dist\CandyCrunch\CandyCrunch.exe -ArgumentList '--self-test', 'O', 'examples\JC_171002Y1_extracted_spectra.xlsx', 'packaging\self_test.mzML' -Wait -PassThru
        Get-Content candycrunch_self_test.log
        exit $app.ExitCode

    - name: Check that the built app predicts (an extracted .xlsx and an mzML, in parallel)
      if: runner.os == 'macOS'
      run: |
        status=0
        dist/CandyCrunch.app/Contents/MacOS/CandyCrunch --self-test O examples/JC_171002Y1_extracted_spectra.xlsx packaging/self_test.mzML || status=$?
        cat candycrunch_self_test.log
        exit $status

    - name: Build the Windows installer
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $version = python -c "from importlib.metadata import version; print(version('candycrunch'))"
        if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
        & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\candycrunch.iss
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Build the macOS disk image
      if: runner.os == 'macOS'
      run: |
        version=$(python -c "from importlib.metadata import version; print(version('candycrunch'))")
        hdiutil create -volname CandyCrunch -srcfolder dist/CandyCrunch.app -ov -format UDZO "dist/CandyCrunch-$version-macOS.dmg"

    - uses: actions/upload-artifact@v4
      with:
        name: CandyCrunch-${{ runner.os }}
        path: |
          dist/CandyCrunch-*-Windows-Setup.exe
          dist/CandyCrunch-*-macOS.dmg

    - name: Attach to the release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/CandyCrunch-*-Windows-Setup.exe
          dist/CandyCrunch-*-macOS.dmg