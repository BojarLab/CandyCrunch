name: Tests

# Every test except the full CandyCrunch evaluation (test_candycrunch_accuracy, test_candycrunch_batch: slow, and their mzML/.raw files are not in git),
# on the oldest and the newest Python CandyCrunch supports; the 3.14 run reports coverage to Codecov

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:
  # python-publish.yml runs these tests before it uploads a release to PyPI
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19 (GitHub notice on the CI runs)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: |
          pyproject.toml
          requirements-dev.txt
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
        python -m pip install --upgrade pip
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install "glycowork @ git+https://github.com/BojarLab/glycowork.git@dev"
        pip install ".[gui]"
        pip install -r requirements-dev.txt
    
    - name: Run tests with pytest
      run: |
        pytest ${{ matrix.python-version == '3.14' && '--cov=candycrunch --cov-report=xml' || '' }} -v -rs -k "not test_candycrunch_accuracy and not test_candycrunch_batch"
      env:
        COVERAGE_CORE: sysmon
    
    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.14'
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}
    
