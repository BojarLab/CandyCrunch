[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "candycrunch"
version = "1.0.0"
description = "Package for predicting glycan structure from LC-MS/MS data"
readme = "README.md"
authors = [
    {name = "Daniel Bojar", email = "daniel.bojar@gu.se"},
]
license = "MIT" 
license-files = ["LICENSE"] 
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"
dependencies = [
    "glycowork>=1.11.1",
    "networkx",
    "scipy",
    "torch>=2.3,<3; platform_system != 'Darwin' or platform_machine != 'x86_64'",
    "torch>=2.2,<2.3; platform_system == 'Darwin' and platform_machine == 'x86_64'",
    "numpy<2; platform_system == 'Darwin' and platform_machine == 'x86_64'",
    "numpy",
    "pandas>=2.2.2",
    "zstandard; python_version < '3.14'",
    "openpyxl",
    "matplotlib>=3.10",
]

[project.urls]
Homepage = "https://github.com/BojarLab/CandyCrunch"

[project.optional-dependencies]
gui = ["PySide6>=6.7", "matplotlib<3.11"]
train = ["glycowork[ml]>=1.11.1", "torchmetrics"]

[project.scripts]
candycrunch_predict = "candycrunch.cli:main"

[project.gui-scripts]
candycrunch_gui = "candycrunch.gui:main"

[tool.setuptools]
include-package-data = false
packages = ["candycrunch"]

[tool.setuptools.package-data]
candycrunch = ["*.csv", "*.pkl", "*.jpg", "*.pt", "*.png", "*.xlsx"]

[tool.setuptools.exclude-package-data]
"*" = ["tests*", "*.ipynb"]

[tool.setuptools.package-dir]
candycrunch = "candycrunch"