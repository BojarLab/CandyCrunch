[pytest]
testpaths = tests
python_files = test_*.py
addopts = -n auto --maxprocesses 4 --dist load --maxschedchunk 1
# matplotlib 3.11 asks Qt 6 for the deprecated AA_UseHighDpiPixmaps when it draws the toolbar icons
filterwarnings =
    ignore:Enum value .Qt..ApplicationAttribute.AA_UseHighDpiPixmaps. is marked as deprecated:DeprecationWarning